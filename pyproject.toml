[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindie-coordinator"
version = "0.5.0.dev5"
description = "Local MindIE coordinator: task stdio MCP and host NPU allocation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Qi Mao" }]
dependencies = [
    "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@210e96dcbbde364f13a6cd45a4f50488226a8a29",
    "remote-dev @ git+https://github.com/mindie-agent/remote-dev@9c8ae5ef70687ce55d77e85b2dbdd79a0844f013",
    "setuptools-scm>=8",
]

[project.optional-dependencies]
test = ["pytest", "jsonschema>=4"]

[project.scripts]
mindie-coordinator = "mindie_coordinator.cli:main"

[project.urls]
Homepage = "https://github.com/mindie-agent/coordinator"

[tool.hatch.build.targets.wheel]
packages = ["mindie_coordinator"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
