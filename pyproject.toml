[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindie-coordinator"
version = "0.6.1"
description = "Local MindIE coordinator: task stdio MCP and host NPU allocation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Qi Mao" }]
dependencies = [
    "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@6460cde3a50a7f91c9ded38557a7f921654f0c6a",
    "remote-dev @ git+https://github.com/mindie-agent/remote-dev@f441d52f8dcb227ad31adeeeb1d66da4a28915bb",
    "setuptools-scm>=8",
]

[project.optional-dependencies]
test = ["pytest", "jsonschema>=4", "psutil>=5.9"]

[project.scripts]
mindie-coordinator = "mindie_coordinator.cli:main"

[project.urls]
Homepage = "https://github.com/mindie-agent/coordinator"

[tool.hatch.build.targets.wheel]
packages = ["mindie_coordinator"]

[tool.hatch.build.targets.sdist]
include = ["/mindie_coordinator", "/tests", "/benchmarks", "/docs", "/README.md", "/README.en.md", "/AGENTS.md", "/LICENSE", "/pyproject.toml"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-m 'not live_npu'"
markers = [
    "unit: fast unit tests with no external system dependencies",
    "integration: local integration tests using in-memory SQLite or subprocesses",
    "live_npu: live SSH integration tests against real Ascend NPU hosts",
]


