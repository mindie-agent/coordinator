[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindie-coordinator"
version = "0.5.0.dev5"
description = "Local MindIE coordinator: task stdio MCP and host NPU allocation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Qi Mao" }]
dependencies = [
    "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@c62c1a6553a293e77b8b98d3523c5d7ff208188f",
    "remote-dev @ git+https://github.com/mindie-agent/remote-dev@2c7f3e4a69b3b54327acea24da5d103b722cd73e",
    "setuptools-scm>=8",
]

[project.optional-dependencies]
test = ["pytest", "jsonschema>=4"]

[project.scripts]
mindie-coordinator = "mindie_coordinator.cli:main"

[project.urls]
Homepage = "https://github.com/mindie-agent/coordinator"

[tool.hatch.build.targets.wheel]
packages = ["mindie_coordinator"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
