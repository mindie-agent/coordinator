[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindie-coordinator"
version = "0.5.0.dev5"
description = "Local MindIE coordinator: task stdio MCP and host NPU allocation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Qi Mao" }]
dependencies = [
    "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@7eed6cdb9935f2922b5b280e9d78ad8eb823f5ce",
    "remote-dev @ git+https://github.com/mindie-agent/remote-dev@ae77c60e22c3d9b81489f048f76fa023ec0622cb",
    "setuptools-scm>=8",
]

[project.optional-dependencies]
test = ["pytest", "jsonschema>=4"]

[project.scripts]
mindie-coordinator = "mindie_coordinator.cli:main"

[project.urls]
Homepage = "https://github.com/mindie-agent/coordinator"

[tool.hatch.build.targets.wheel]
packages = ["mindie_coordinator"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
