name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: mindie-agent/mindie-bench/.github/workflows/publish-release.yml@26d889179ffe5b4e6803fb127fdfb517a85266f0
    with:
      setup-command: |
        uv venv --python 3.13 && uv pip install -e ".[test]"
      test-command: |
        .venv/bin/python -m pytest -q -m "not live_npu"
