name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read
  deployments: read

jobs:
  release:
    uses: mindie-agent/mindie-bench/.github/workflows/publish-release.yml@main
    with:
      release-notes-path: docs/releases/coordinator-0.7.6.md
      setup-command: |
        uv venv --python 3.13 && uv pip install -e ".[test]"
      test-command: |
        .venv/bin/python -m pytest -q -m "not live_npu"
        sudo -n env PYTHONPATH="$PWD" .venv/bin/python -m unittest discover -s tests -p test_owned_completion.py -v
