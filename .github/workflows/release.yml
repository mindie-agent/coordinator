name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: mindie-agent/mindie-bench/.github/workflows/publish-release.yml@0a3c9fd81fb37a1b4a52807d35509daca777ebf2
    with:
      benchmark-ref: 0a3c9fd81fb37a1b4a52807d35509daca777ebf2
      setup-command: |
        uv venv --python 3.13 && uv pip install -e ".[test]"
      test-command: |
        .venv/bin/python -m pytest -q -m "not live_npu"
        sudo -n env PYTHONPATH="$PWD" .venv/bin/python -m unittest discover -s tests -p test_owned_completion.py -v
