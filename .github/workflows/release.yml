name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: mindie-agent/mindie-bench/.github/workflows/publish-release.yml@f65b6bbe39e6d72110341476a2066e30b2adbf77
    with:
      setup-command: |
        uv venv --python 3.13 && uv pip install -e ".[test]"
      test-command: |
        .venv/bin/python -m pytest -q -m "not live_npu"
        sudo -n env PYTHONPATH="$PWD" .venv/bin/python -m unittest discover -s tests -p test_owned_completion.py -v
