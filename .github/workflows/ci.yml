name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  developer-setup:
    # Fresh checkout: nothing before the README commands may touch `.venv`.
    # `uv venv` (no `--clear`) is the first documented command; it must work
    # as a developer meets it on a clone.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # Match the reusable release publisher's managed interpreter.
          python-version: '3.13'
          activate-environment: false

      - name: Documented developer setup
        env:
          HOME: ${{ runner.temp }}/empty-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg-config
          XDG_DATA_HOME: ${{ runner.temp }}/xdg-data
          MINDIE_CONFIG_HOME: ${{ runner.temp }}/mindie-config
          MINDIE_DATA_HOME: ${{ runner.temp }}/mindie-data
          MINDIE_DIAGNOSTICS_ROOT: ${{ runner.temp }}/mindie-diag
          REMOTE_DEV_AUTH_DIR: ${{ runner.temp }}/rdev-auth
          REMOTE_DEV_STATE_DIR: ${{ runner.temp }}/rdev-state
        run: |
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$MINDIE_CONFIG_HOME" "$MINDIE_DATA_HOME" "$MINDIE_DIAGNOSTICS_ROOT" "$REMOTE_DEV_AUTH_DIR" "$REMOTE_DEV_STATE_DIR"
          uv venv
          uv pip install -e ".[test]"
          .venv/bin/python -m pytest -q -m "not live_npu" --durations=20 --junitxml=linux-coordinator.xml

      - name: Validate host process and port completion
        run: |
          sudo -n env PYTHONPATH="$PWD" .venv/bin/python -m unittest discover -s tests -p test_owned_completion.py -v

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-coordinator-results
          path: linux-coordinator.xml

  wheel:
    # Out-of-tree installed-artifact smoke gate: build wheel, switch to blank
    # temp directory outside checkout, verify package + worker resources + MCP initialize.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          activate-environment: false

      - name: Build, install the wheel out-of-tree, import, CLI --help, and MCP initialize
        env:
          HOME: ${{ runner.temp }}/empty-home
          MINDIE_CONFIG_HOME: ${{ runner.temp }}/mindie-config
          MINDIE_DATA_HOME: ${{ runner.temp }}/mindie-data
          MINDIE_DIAGNOSTICS_ROOT: ${{ runner.temp }}/mindie-diag
        run: |
          mkdir -p "$HOME" "$MINDIE_CONFIG_HOME" "$MINDIE_DATA_HOME" "$MINDIE_DIAGNOSTICS_ROOT"
          unset GH_TOKEN GITHUB_TOKEN REMOTE_DEV_READ_TOKEN PYTHONPATH
          uv build
          cd "${{ runner.temp }}"
          mkdir -p blank-smoke && cd blank-smoke
          uv venv .venv-wheel
          VIRTUAL_ENV="$PWD/.venv-wheel" uv pip install "${{ github.workspace }}"/dist/*.whl
          .venv-wheel/bin/python -c "import mindie_coordinator, pathlib; from mindie_coordinator.workers import load_worker_source; p=pathlib.Path(mindie_coordinator.__file__).resolve(); assert 'site-packages' in p.parts, p; assert 'select_python' in load_worker_source('python_selector.py')"
          .venv-wheel/bin/mindie-coordinator --help
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}\n' | .venv-wheel/bin/python -m mindie_coordinator.task_server | grep -q '"protocolVersion"'

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          activate-environment: false
      - name: Install native local control plane
        env:
          HOME: ${{ runner.temp }}/coordinator-test-home
          USERPROFILE: ${{ runner.temp }}/coordinator-test-home
        run: |
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          uv venv
          uv pip install -e ".[test]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate Git Bash and UTF-8 resolution under Windows PowerShell 5.1
        shell: powershell
        env:
          HOME: ${{ runner.temp }}/coordinator-test-home
          USERPROFILE: ${{ runner.temp }}/coordinator-test-home
        run: |
          $ErrorActionPreference = 'Stop'
          .\.venv\Scripts\python.exe -c "from mindie_coordinator.local_exec import resolve_bash, resolve_git; g = resolve_git(); b = resolve_bash(); assert 'system32' not in b.lower() and b.lower().endswith('bash.exe'), b; print('PS51_GIT_BASH_OK', g, b)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows coordinator test suite
        env:
          HOME: ${{ runner.temp }}/coordinator-test-home
          USERPROFILE: ${{ runner.temp }}/coordinator-test-home
        run: |
          $gitBin = Join-Path $env:ProgramFiles 'Git/bin'
          if (-not (Test-Path -LiteralPath (Join-Path $gitBin 'bash.exe'))) {
            throw 'Git Bash is required by the local Linux-peer test fixtures'
          }
          $env:PATH = "$gitBin;$env:PATH"
          .venv/Scripts/python.exe -m pytest -q tests -m "not live_npu" --durations=20 --junitxml=windows-coordinator.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-coordinator-results
          path: windows-coordinator.xml

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          activate-environment: false
      - name: Validate the native macOS control plane
        env:
          HOME: ${{ runner.temp }}/coordinator-test-home
        run: |
          mkdir -p "$HOME"
          uv venv
          uv pip install -e ".[test]"
          .venv/bin/python -m pytest -q tests -m "not live_npu" --durations=20 --junitxml=macos-coordinator.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-coordinator-results
          path: macos-coordinator.xml

  release-ready:
    name: release-ready
    needs: [developer-setup, wheel, windows, macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -c 'import json,os; assert all(job["result"] == "success" for job in json.loads(os.environ["RESULTS"]).values()), "required CI failed or was skipped"'
