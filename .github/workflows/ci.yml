name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  developer-setup:
    # Fresh checkout: nothing before the README commands may touch `.venv`.
    # `uv venv` (no `--clear`) is the first documented command; it must work
    # as a developer meets it on a clone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          activate-environment: false

      - name: Documented developer setup
        # remote-dev is public. Fetch it anonymously; do not reintroduce a
        # private-token step or a git credential rewrite.
        env:
          HOME: ${{ runner.temp }}/empty-home
        run: |
          mkdir -p "$HOME"
          uv venv
          uv pip install "remote-dev @ git+https://github.com/mindie-agent/remote-dev@13301ef7f52b53ffca0a6702a8a3c18f2edfcd52"
          uv pip install pytest "jsonschema>=4" "setuptools-scm>=8"
          uv pip install -e . --no-deps
          .venv/bin/python -m pytest -q --durations=20 --junitxml=linux-coordinator.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-coordinator-results
          path: linux-coordinator.xml

  wheel:
    # P14: build the wheel, install it into a clean venv, import the
    # package, run the console script. remote-dev is not on PyPI, so
    # the clean venv installs it from the public git URL first. That
    # fetch is anonymous; a token step here is a defect.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          activate-environment: false

      - name: Build, install the wheel, import, and --help
        env:
          HOME: ${{ runner.temp }}/empty-home
        run: |
          mkdir -p "$HOME"
          unset GH_TOKEN GITHUB_TOKEN REMOTE_DEV_READ_TOKEN
          uv build
          cd "${{ runner.temp }}"
          uv venv .venv-wheel
          VIRTUAL_ENV="$PWD/.venv-wheel" uv pip install \
            "remote-dev @ git+https://github.com/mindie-agent/remote-dev@13301ef7f52b53ffca0a6702a8a3c18f2edfcd52"
          VIRTUAL_ENV="$PWD/.venv-wheel" uv pip install "${{ github.workspace }}"/dist/*.whl
          .venv-wheel/bin/python -c "import mindie_coordinator, pathlib; p=pathlib.Path(mindie_coordinator.__file__).resolve(); assert 'site-packages' in p.parts, p"
          .venv-wheel/bin/mindie-coordinator --help

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          activate-environment: false
      - name: Install and validate native local control plane
        env:
          HOME: ${{ runner.temp }}/coordinator-test-home
          USERPROFILE: ${{ runner.temp }}/coordinator-test-home
        run: |
          # Use Git Bash for local Linux-peer fixtures. The Windows bash.exe
          # alias can point at WSL with no distribution installed on the runner.
          $gitBin = Join-Path $env:ProgramFiles 'Git/bin'
          if (-not (Test-Path -LiteralPath (Join-Path $gitBin 'bash.exe'))) {
            throw 'Git Bash is required by the local Linux-peer test fixtures'
          }
          $env:PATH = "$gitBin;$env:PATH"
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          uv venv
          uv pip install "remote-dev @ git+https://github.com/mindie-agent/remote-dev@13301ef7f52b53ffca0a6702a8a3c18f2edfcd52"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install pytest "jsonschema>=4" "setuptools-scm>=8"
          uv pip install -e . --no-deps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pytest -q tests --durations=20 --junitxml=windows-coordinator.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-coordinator-results
          path: windows-coordinator.xml

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          activate-environment: false
      - name: Validate the native macOS control plane
        env:
          HOME: ${{ runner.temp }}/coordinator-test-home
        run: |
          mkdir -p "$HOME"
          uv venv
          uv pip install "remote-dev @ git+https://github.com/mindie-agent/remote-dev@13301ef7f52b53ffca0a6702a8a3c18f2edfcd52"
          uv pip install pytest "jsonschema>=4" "setuptools-scm>=8"
          uv pip install -e . --no-deps
          .venv/bin/python -m pytest -q tests --durations=20 --junitxml=macos-coordinator.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-coordinator-results
          path: macos-coordinator.xml
